<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: Georgia, 'Times New Roman', serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 100vh;
    background: #fff;
    color: #111;
    text-align: center;
  }
  .rule { width: 80px; height: 3px; background: #2e5fa3; margin: 0 auto 28px; }
  .label {
    font-size: 11pt;
    font-weight: 400;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: #2e5fa3;
    margin-bottom: 18px;
  }
  .title {
    font-size: 28pt;
    font-weight: 700;
    line-height: 1.25;
    max-width: 75%;
    color: #111;
  }
</style>
</head>
<body>
  <div class="rule"></div>
  <div class="label">Solutions — Chapter 10</div>
  <div class="title">Least Squares</div>
</body>
</html>
